services:

  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allgoods -d allgoodsretail"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  python:
    build:
      context: .
      dockerfile: Dockerfile
    
    volumes:
      - ./retail_data_generator/output:/app/retail_data_generator/output

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
      
      